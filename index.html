<!DOCTYPE html>
<html lang="zh-CN" data-theme>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymFlow">
  <title>GymFlow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 开屏动画 -->
<div id="splash">
  <div class="splash-logo">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <!-- 外圆 -->
      <circle cx="40" cy="40" r="34" fill="none" stroke="#00c853" stroke-width="2.5" stroke-dasharray="214" stroke-dashoffset="214">
        <animate attributeName="stroke-dashoffset" from="214" to="0" dur="0.6s" fill="freeze"/>
      </circle>
      <!-- 哑铃 -->
      <g>
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
        <rect x="16" y="36" width="48" height="8" rx="3" fill="#00c853"/>
        <rect x="10" y="22" width="9" height="36" rx="2.5" fill="#0a0a0a" stroke="#00c853" stroke-width="2"/>
        <rect x="61" y="22" width="9" height="36" rx="2.5" fill="#0a0a0a" stroke="#00c853" stroke-width="2"/>
      </g>
    </svg>
  </div>
  <div class="splash-name">GymFlow</div>
  <div class="splash-sub">健身助手</div>
</div>

<div id="app-wrap">

  <!-- ========== 顶部导航 ========== -->
  <nav id="top-bar">
    <div class="top-bar-inner">
      <button class="top-tab active" data-page="training">🏋️ 训练</button>
      <button class="top-tab" data-page="ai">🤖 AI</button>
      <button class="top-tab" data-page="features">📦 功能</button>
      <button class="top-tab" data-page="me">👤 我的</button>
    </div>
  </nav>

  <!-- ========== 主内容区 ========== -->
  <main id="app">
    <!-- 训练页 -->
    <section id="page-training" class="page active">
      <div id="training-content"></div>
    </section>

    <!-- 功能页 -->
    <section id="page-features" class="page">
      <div id="features-content"></div>
    </section>

    <!-- AI 顾问页 -->
    <section id="page-ai" class="page">
      <div id="ai-content"></div>
    </section>

    <!-- 我的页 -->
    <section id="page-me" class="page">
      <div id="me-content"></div>
    </section>
  </main>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- 庆祝弹窗 -->
<div id="celebration" class="celebration-hidden">
  <div class="celebration-content">
    <span class="celebration-emoji">🎉</span>
    <h2>训练完成！</h2>
    <p>太棒了，继续保持！</p>
    <button class="btn btn-accent" onclick="closeCelebration()">确定</button>
  </div>
</div>

<!-- Chart.js -->
<script src="js/chart.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/exercises.js"></script>
<script src="js/data.js"></script>
<script src="js/training.js"></script>
<script src="js/ai.js"></script>
<script src="js/weight.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
